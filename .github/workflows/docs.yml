# Builds the documentation site on every push to main and publishes it to GitHub
# Pages, along with the llms.txt and llms-full.txt indexes generated with it.
name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --python 3.12

      # -- mkdocs runs in strict mode, so a broken cross-reference fails here --
      - name: Build site
        run: uv run mkdocs build
        env:
          NO_MKDOCS_2_WARNING: "true"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write      # -- publish the site --
      id-token: write   # -- mint the OIDC token the deploy action verifies --

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
