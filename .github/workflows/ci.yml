name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --python ${{ matrix.python-version }}

      - name: Unit tests
        run: uv run pytest -q

      - name: Acceptance tests
        run: uv run behave --format progress --tags=-wip

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --python 3.12

      - name: Ruff
        run: uv run ruff check .

  typecheck:
    name: typecheck (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --python 3.12

      # Reports the pyright error count without failing the build. The code
      # inherited from upstream v1.2.0 does not pass strict mode against the
      # pinned types-lxml stubs, so this cannot gate merges yet; surfacing the
      # count in the job summary is meant to keep it visible and shrinking.
      - name: Pyright
        run: |
          uv run pyright --outputjson > pyright.json || true
          count=$(python -c "import json;print(json.load(open('pyright.json'))['summary']['errorCount'])")
          echo "### Pyright: $count errors" >> "$GITHUB_STEP_SUMMARY"
          echo "Not a gate; see workflow comment for why." >> "$GITHUB_STEP_SUMMARY"
